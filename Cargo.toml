[workspace]
resolver = "3"
members = [
    "crates/ate-cli",
    "crates/executor-core",
    "crates/executor-plugin",
    "crates/executor-protocol",
    "crates/executor-tools",
    "crates/windows-agent-client",
    "crates/wsl-executor-daemon",
    "crates/wsl-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
flate2 = "1"
futures-util = "0.3"
glob = "0.3"
jsonschema = "0.48.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = true
strip = true
